<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      .stem {
        stroke: #F59E0B;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawStem 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.2s;
      }
      .branch-1 {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: drawStem 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.8s;
      }
      .branch-2 {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: drawStem 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 1s;
      }
      .leaf-l {
        fill: #FFB52E;
        fill-opacity: 0.2;
        stroke: #F59E0B;
        stroke-width: 1.2;
        opacity: 0;
        transform-origin: 100px 135px;
        animation: sprout 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.1s;
      }
      .leaf-r {
        fill: #FFB52E;
        fill-opacity: 0.2;
        stroke: #F59E0B;
        stroke-width: 1.2;
        opacity: 0;
        transform-origin: 100px 112px;
        animation: sprout 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.3s;
      }
      .flower-head {
        transform-origin: 105px 42px;
        animation: bloom 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.4s,
                   sway 8s ease-in-out infinite alternate 3.2s;
      }
      .petal {
        fill: #F0B7A8;
        fill-opacity: 0.42;
      }
      .petal-sub {
        fill: #F0B7A8;
        fill-opacity: 0.30;
      }
      .center {
        fill: #F59E0B;
        fill-opacity: 0.65;
      }

      @keyframes drawStem {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sprout {
        0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes bloom {
        0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
        70% { opacity: 0.85; transform: scale(1.08) rotate(3deg); }
        100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
      }
      @keyframes sway {
        0% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(2.5deg) translateY(-3px); }
        100% { transform: rotate(-1.5deg) translateY(2px); }
      }
    </style>
  </defs>

  <!-- Stem & Branches -->
  <path class="stem" d="M100 185 Q98 135 100 95 Q101 68 105 48" />
  <path class="stem branch-1" d="M100 135 Q78 124 68 108" />
  <path class="stem branch-2" d="M100 112 Q122 102 132 86" />

  <!-- Leaves -->
  <path class="leaf-l" d="M68 108 Q52 104 46 90 Q60 90 68 108 Z" />
  <path class="leaf-r" d="M132 86 Q148 82 154 68 Q140 68 132 86 Z" />

  <!-- Blooming Petals Head -->
  <g class="flower-head">
    <circle class="petal" cx="105" cy="42" r="21" />
    <circle class="petal-sub" cx="88" cy="34" r="16" />
    <circle class="petal-sub" cx="120" cy="36" r="16" />
    <circle class="petal-sub" cx="98" cy="22" r="14" />
    <circle class="petal-sub" cx="112" cy="24" r="14" />
    <circle class="center" cx="105" cy="42" r="9" />
  </g>
</svg>
