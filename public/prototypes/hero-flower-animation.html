<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section with Flower Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream-50: #FBF8F4;
      --cream-100: #F7F2EB;
      --cream-300: #E4D6C0;
      --ink-900: #1A1A1A;
      --ink-600: #525252;
      --ink-500: #6B6B6B;
      --marigold-400: #FFB52E;
      --marigold-500: #F59E0B;
      --marigold-600: #D97D06;
      --blush-petal: #F0B7A8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cream-50);
      color: var(--ink-900);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 100px 24px 80px;
      width: 100%;
    }

    /* Blueprint grid background */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, #2B2B2B 1px, transparent 1px),
        linear-gradient(to bottom, #2B2B2B 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.04;
      pointer-events: none;
    }

    .container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      z-index: 10;
    }

    .content {
      max-width: 780px;
    }

    .eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--marigold-600);
      animation: fadeIn 0.8s ease-out forwards;
    }

    .headline {
      margin-top: 18px;
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(44px, 7vw, 84px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: var(--ink-900);
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .subhead {
      margin-top: 24px;
      max-width: 580px;
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.6;
      color: var(--ink-600);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    .cta-row {
      margin-top: 36px;
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--ink-900);
      color: var(--cream-50);
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(26,26,26,0.06);
    }

    .btn:hover {
      background-color: #2e2e2e;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26,26,26,0.12);
    }

    .btn svg {
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: translateX(4px);
    }

    
.trust-strip {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(26, 26, 26, 0.12);
  max-width: 560px;
  animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
}
.trust-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.trust-badge {
  display: inline-flex;
  align-items: center;
  border-radius: 9999px;
  border: 1px solid rgba(26, 26, 26, 0.15);
  background: rgba(243, 237, 226, 0.8);
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-800, #222);
}
.trust-note {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--ink-500, #666);
  line-height: 1.4;
}

.stats {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 560px;
      animation: fadeUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .stat-val {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(26px, 3.5vw, 36px);
      font-weight: 600;
      color: var(--ink-900);
      line-height: 1.1;
    }

    .stat-lbl {
      margin-top: 4px;
      font-size: 13px;
      color: var(--ink-500);
      line-height: 1.35;
    }

    /* ===================================================
       FLOWER SVG & ANIMATION SYSTEM
       =================================================== */
    .flower-wrap {
      position: absolute;
      right: -20px;
      top: 40px;
      width: clamp(320px, 36vw, 480px);
      height: clamp(320px, 36vw, 480px);
      pointer-events: none;
      z-index: 5;
    }

    @media (max-width: 900px) {
      .flower-wrap {
        opacity: 0.45;
        right: -60px;
        top: 80px;
      }
    }

    .flower-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* 1. Stem Drawing Animation */
    .stem-path {
      stroke: var(--marigold-500);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawStem 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.2s;
    }

    /* 2. Leaves Growth */
    .leaf {
      fill: var(--marigold-400);
      fill-opacity: 0.18;
      stroke: var(--marigold-500);
      stroke-width: 1.2;
      opacity: 0;
      transform-origin: 100px 120px;
      animation: sproutLeaf 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
    }
    .leaf-2 {
      transform-origin: 100px 105px;
      animation-delay: 1.2s;
    }

    /* 3. Petals Blooming Animation */
    .flower-head {
      transform-origin: 105px 42px;
      animation: bloomPetals 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.3s,
                 gentleSway 8s ease-in-out infinite alternate 3.1s;
    }

    .petal {
      fill: var(--blush-petal);
      fill-opacity: 0.42;
      transform-origin: 105px 42px;
      transition: fill 0.3s;
    }

    .petal-center {
      fill: var(--marigold-500);
      fill-opacity: 0.65;
    }

    /* Keyframes */
    @keyframes drawStem {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes sproutLeaf {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-15deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes bloomPetals {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-25deg);
      }
      70% {
        opacity: 0.85;
        transform: scale(1.08) rotate(3deg);
      }
      100% {
        opacity: 0.75;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes gentleSway {
      0% {
        transform: rotate(0deg) translateY(0);
      }
      50% {
        transform: rotate(2.5deg) translateY(-3px);
      }
      100% {
        transform: rotate(-1.5deg) translateY(2px);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    
    <!-- FLOWER ANIMATION SVG -->
    <div class="flower-wrap" aria-hidden="true">
      <svg class="flower-svg" viewBox="0 0 200 200" fill="none">
        <!-- Stem & Branches (Draws smoothly) -->
        <g class="stem-group">
          <path class="stem-path" d="M100 185 Q98 135 100 95 Q101 68 105 48" />
          <path class="stem-path" d="M100 135 Q78 124 68 108" style="animation-delay: 0.7s;" />
          <path class="stem-path" d="M100 112 Q122 102 132 86" style="animation-delay: 0.9s;" />
        </g>

        <!-- Leaves -->
        <g>
          <path class="leaf" d="M68 108 Q52 104 46 90 Q60 90 68 108 Z" />
          <path class="leaf leaf-2" d="M132 86 Q148 82 154 68 Q140 68 132 86 Z" />
        </g>

        <!-- Flower Head (Petals bloom and sway) -->
        <g class="flower-head">
          <circle class="petal" cx="105" cy="42" r="21" />
          <circle class="petal" cx="88" cy="34" r="16" style="fill-opacity: 0.32;" />
          <circle class="petal" cx="120" cy="36" r="16" style="fill-opacity: 0.32;" />
          <circle class="petal" cx="98" cy="22" r="14" style="fill-opacity: 0.28;" />
          <circle class="petal" cx="112" cy="24" r="14" style="fill-opacity: 0.28;" />
          <circle class="petal-center" cx="105" cy="42" r="9" />
        </g>
      </svg>
    </div>

    <!-- MAIN HERO CONTENT -->
    <div class="container">
      <div class="content">
        <p class="eyebrow">Renovation · Construction · Repair</p>

        <h1 class="headline">
          For the love<br />of building.
        </h1>

        <p class="subhead">
          You bring the plan — or the problem. We bring the crew, the equipment and the skill to make it happen, from a leaking bathroom to a whole house.
        </p>

        <div class="cta-row">
          <a href="#our-work" class="btn">
            <span>See our work</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </a>
        </div>

        <div class="stats">
          <div>
            <div class="stat-val">100+</div>
            <div class="stat-lbl">Projects completed</div>
          </div>
          <div>
            <div class="stat-val">9+</div>
            <div class="stat-lbl">Years of experience</div>
          </div>
          <div>
            <div class="stat-val">G2</div>
            <div class="stat-lbl">CIDB registered contractor</div>
          </div>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
